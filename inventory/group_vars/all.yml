pve_node: "pve"
pve_storage: "local-lvm"
pve_template_name: "debian12-template"
ci_user: "automation"

mgmt_bridge: "vmbr10"
lab_bridge: "vmbr20"
mgmt_gateway: "10.60.10.1"
ssh_pubkey_file: "/home/automation/.ssh/id_ed25519.pub"

common_packages:
  - qemu-guest-agent
  - curl
  - wget
  - git
  - vim
  - jq
  - htop
  - net-tools
  - iproute2
  - iputils-ping
  - tcpdump
  - traceroute
  - netcat-openbsd
  - ethtool
  - python3
  - python3-pip
  - ca-certificates
  - gnupg
  - openssh-server

