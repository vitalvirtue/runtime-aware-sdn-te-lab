- import_playbook: 11a-deploy-two-edge-te-baseline.yml


- name: Replace inter-edge OVS tunnel ports with Linux VXLAN interfaces on edge-a
  hosts: lab-sdn-edge-ovs-a-01
  become: true
  gather_facts: false

  vars:
    bridge: br-edge0
    remote_edge_ip: "10.60.20.22"

  tasks:
    - name: Create controllable Linux VXLAN path interfaces on edge-a
      ansible.builtin.shell: |
        set -euo pipefail

        BR="{{ bridge }}"
        REMOTE="{{ remote_edge_ip }}"

        LOCAL_UNDERLAY="$(ip -4 route get "$REMOTE" | awk '{for(i=1;i<=NF;i++) if ($i=="src") {print $(i+1); exit}}')"
        DEV="$(ip -4 route get "$REMOTE" | awk '{for(i=1;i<=NF;i++) if ($i=="dev") {print $(i+1); exit}}')"

        for p in path1-to-b path2-to-b; do
          ovs-vsctl --if-exists del-port "$BR" "$p" || true
          ip link del "$p" >/dev/null 2>&1 || true
        done

        sleep 1

        ip link add path1-to-b type vxlan id 301 local "$LOCAL_UNDERLAY" remote "$REMOTE" dstport 4791 dev "$DEV" nolearning
        ip link add path2-to-b type vxlan id 302 local "$LOCAL_UNDERLAY" remote "$REMOTE" dstport 4792 dev "$DEV" nolearning

        ip link set path1-to-b mtu 1450
        ip link set path2-to-b mtu 1450
        ip link set path1-to-b up
        ip link set path2-to-b up

        ovs-vsctl --may-exist add-port "$BR" path1-to-b
        ovs-vsctl --may-exist add-port "$BR" path2-to-b

        # path-1 stays clean/low-cost.
        tc qdisc del dev path1-to-b root >/dev/null 2>&1 || true

        # path-2 is our higher-cost path.
        tc qdisc replace dev path2-to-b root netem delay 120ms

        echo "EDGE_A_LINUX_PATHS_READY local=${LOCAL_UNDERLAY} dev=${DEV}"
        tc qdisc show dev path1-to-b
        tc qdisc show dev path2-to-b
      args:
        executable: /bin/bash
      register: edge_a_paths

    - name: Show edge-a Linux path state
      ansible.builtin.debug:
        var: edge_a_paths.stdout_lines


