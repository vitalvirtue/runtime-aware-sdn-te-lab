      changed_when: false

    - name: Show edge-b flow counters
      ansible.builtin.debug:
        var: edge_b_flows.stdout_lines

    - name: Validate edge-b TE counters
      ansible.builtin.shell: |
        set -euo pipefail

        ovs-ofctl -O OpenFlow13 dump-flows br-edge0 > /tmp/edge-b-flows.txt

        get_packets() {
          local src="$1"
          local dst="$2"
          local line
          line="$(grep -F "nw_src=${src}" /tmp/edge-b-flows.txt | grep -F "nw_dst=${dst}" | head -n 1 || true)"

          if [ -z "$line" ]; then
            echo "FLOW_NOT_FOUND"
            return 0
          fi

          echo "$line" | sed -n 's/.*n_packets=\([0-9][0-9]*\).*/\1/p'
        }

        check_flow() {
          local name="$1"
