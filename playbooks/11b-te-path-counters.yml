            return 1
          fi

          if [ "$packets" -le 0 ]; then
            echo "FAIL ${name}: expected packets > 0"
            return 1
          fi
        }

        check_flow "api_to_db_from_path1"   "172.31.210.12" "172.31.210.13"
        check_flow "db_to_api_return_path1" "172.31.210.13" "172.31.210.12"
        check_flow "bulk_to_api_path2"      "172.31.210.14" "172.31.210.12"
        check_flow "bulk_to_db_denied"      "172.31.210.14" "172.31.210.13"

        echo "EDGE_B_TE_COUNTERS_PASS"
      args:
        executable: /bin/bash
      register: edge_b_counter_check

    - name: Show edge-b counter validation
      ansible.builtin.debug:
        var: edge_b_counter_check.stdout_lines


- name: Final TE counter assertion
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Mark TE counter baseline passed
      ansible.builtin.debug:
        msg: "TE_PATH_COUNTER_BASELINE_PASS"
